name: Build VTFLib

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -A x64

      - name: Build
        run: >
          cmake
          --build build
          --config Release
          --target vtflib vtflib_static vtfcmd vtfedit
          --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VTFLib-windows-x64
          if-no-files-found: error
          path: |
            build/bin/**/*.dll
            build/bin/**/*.exe
            build/bin/**/*.lib
            build/lib/**/*.lib

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build build \
            --target vtflib vtflib_static \
            --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VTFLib-linux-x64
          if-no-files-found: error
          path: |
            build/bin/**/*.so
            build/bin/**/*.a
            build/lib/**/*.so
            build/lib/**/*.a